name: CI

on:
  pull_request:
  push:
    # Renovate only opens a PR once its branch has checks (prCreation:
    # not-pending), so its update branches are checked on push too.
    branches: [main, "renovate/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
